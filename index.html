<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Júlio Simões | Identidade Digital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Júlio Simões</h1>
            <nav>
                <ul>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#projetos">Projetos</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="hero">
                <div>
                    <h2>Título</h2>
                    <p>Descrição</p>
                    <a href="#projetos">Botão</a>
                </div>
                <div>
                    <img src="#" alt="Foto de Júlio Simões">
                </div>
            </section>

            <section id="sobre">
                <h2>Sobre mim</h2>
                <p>Descrição</p>
            </section>

            <section id="projetos">
                <h2>Projetos</h2>
                <div>
                    <article class="card">
                        <h3>Título</h3>
                        <p>Descrição</p>
                        <img src="" alt="">
                    </article>
                    <article class="card">
                        <h3>Título</h3>
                        <p>Descrição</p>
                        <img src="" alt="">
                    </article>
                </div>
            </section>

            <section id="contato">
                <h2>Contato</h2>
                <p>Descrição</p>
                <form action="#" method="post">
                    <div>
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Nome" required>
                    </div>
                    <div>
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="E-mail" required>
                    </div>
                    <div>
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" placeholder="Mensagem" required></textarea>
                    </div>
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Júlio Simões. Todos os direitos reservados.</p>
            <div>
                <a href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
                <a href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
        </footer>
    </div>
</body>

</html>
